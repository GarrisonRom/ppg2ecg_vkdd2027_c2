# v0.63: v0.61 plus light differentiable QRS amplitude and peak-interval
# supervision.  The target-derived masks/anchors are training-only signals;
# neither motion state nor ECG targets enter the inference path.

experiment:
  name: senssmarttech_v063_vae_multiband_qrs_peak_20ep_seed42

data:
  dataset: senssmarttech
  root: data/processed/SensSmartTech/subjectwise_per-lead
  ppg_channel: null
  batch_size: 16
  num_workers: 4

model:
  latent_dim: 128
  init_encoder_checkpoint: runs/senssmarttech_vae_flow_adv_irm_20ep_seed42/best.pth
  init_encoder_mode: strict

  encoder:
    name: vae_encoder
    content_dim: 64
    style_dim: 64
    base_channels: 32
    dropout: 0.1

  decoder:
    name: multiband_decoder
    base_channels: 32
    dropout: 0.0
    sample_rate: 250.0
    low_max_hz: 0.5
    mid_max_hz: 10.0
    high_max_hz: 40.0

  band_loss:
    enabled: true
    total_weight: 0.25
    normalize: true
    scale_floor: 0.05
    weights:
      low: 0.5
      mid: 1.0
      high: 2.0

  loss:
    weights:
      mse: 1.0
      l1: 0.0
      qrs_weighted: 0.0
      qrs_amplitude: 0.05
      derivative: 0.05
      freq: 0.0
      peak_interval: 0.05
      dtw: 0.0
      perceptual: 0.0
    qrs:
      qrs_width_ms: 80.0
      baseline_ms: 400.0
      peak_window_ms: 80.0
      peak_threshold: 0.45
      lead_index: 1
      scale_floor: 0.05
    wavelet:
      haar_levels: 4
      haar_qrs_levels: [2, 3, 4]
      peak_window_ms: 100.0
      search_radius_ms: 80.0
      peak_threshold: 0.25
      softmax_temperature: 0.05
      max_peaks: 16
      lead_index: 1

  adversarial:
    enabled: true
    hidden_dim: 128
    dropout: 0.1
    loss_weight: 0.1
    grl_max_lambda: 0.3
    grl_warmup_epochs: 3

  irm:
    enabled: true
    mode: vrex
    environment: subject
    loss_weight: 0.01
    min_env_samples: 2

  cycle_consistency: null
  diffusion: null

training:
  epochs: 20
  lr: 0.0001
  weight_decay: 0.00001
  min_lr: 0.000001
  max_grad_norm: 1.0
  diff_weight: 0.0
  flow_weight: 0.0
  vae_kl_weight: 0.001
  encoder_freeze_epochs: 5
  use_posterior_mean_when_frozen: true
  selection_metric: total
  save_every: 5

seed: 42
device: auto
