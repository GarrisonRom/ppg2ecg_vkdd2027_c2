# v0.53: SWT-supervised QRS-aware ECG generation.
# Controlled against v0.52: keep the multi-band time-domain decoder and the
# frozen reverse ECG->PPG cycle, but replace the FFT band objective with a
# shift-stable Symlet-4 wavelet coefficient/envelope objective.

experiment:
  name: senssmarttech_v053_wavelet_frozen_cycle_20ep_seed42

data:
  dataset: senssmarttech
  root: data/processed/SensSmartTech/subjectwise_per-lead
  ppg_channel: null
  batch_size: 16
  num_workers: 4

model:
  latent_dim: 128

  encoder:
    name: baseline_encoder
    base_channels: 32
    dropout: 0.1

  # Same decoder capacity as v0.52. Wavelet terms supervise the fused output;
  # no wavelet coefficients are supplied as an inference-time condition.
  decoder:
    name: multiband_decoder
    base_channels: 32
    dropout: 0.0
    sample_rate: 250.0
    low_max_hz: 0.5
    mid_max_hz: 10.0
    high_max_hz: 40.0

  # Disable the v0.52 FFT band loss for this isolation experiment.
  band_loss:
    enabled: false

  cycle_consistency:
    enabled: true
    reverse_encoder:
      name: baseline_encoder
      base_channels: 32
      dropout: 0.0
    reverse_decoder:
      name: baseline_decoder
      base_channels: 32
      dropout: 0.0
    signal_loss: l1
    direct_ecg2ppg_weight: 1.0
    ppg_cycle_weight: 0.5
    reverse_pretrain_epochs: 10
    freeze_reverse: true
    pretrain_ecg_weight: 1.0

  diffusion: null

  loss:
    weights:
      mse: 0.0
      l1: 1.0
      qrs_weighted: 0.0
      derivative: 0.05
      freq: 0.0
      wavelet: 0.20
      wavelet_qrs: 0.15
      dtw: 0.0
      perceptual: 0.0
    wavelet:
      levels: 5
      # D2-D4 are approximately 8-62.5 Hz at 250 Hz and cover QRS detail.
      qrs_levels: [2, 3, 4]
      approx_weight: 0.25
      detail_weights: [0.25, 1.0, 1.0, 1.0, 0.5]
      normalize: true
      scale_floor: 0.05
      smooth_kernel: 3

  adversarial:
    enabled: false
  irm:
    enabled: false

training:
  epochs: 20
  lr: 0.0001
  weight_decay: 0.00001
  min_lr: 0.000001
  max_grad_norm: 1.0
  diff_weight: 0.0
  flow_weight: 0.0
  vae_kl_weight: 0.0
  selection_metric: ecg_total
  save_every: 5

seed: 42
device: auto
