# v0.59: low-weight QRS/amplitude supervision on the v0.52 multi-band model.
# This is a conservative follow-up to v0.58 after the stronger QRS terms
# disturbed the already-good peak timing of v0.52.

experiment:
  name: senssmarttech_v059_multiband_qrs_amplitude_lowweight_20ep_seed42

data:
  dataset: senssmarttech
  root: data/processed/SensSmartTech/subjectwise_per-lead
  ppg_channel: null
  batch_size: 16
  num_workers: 4

model:
  latent_dim: 128

  encoder:
    name: baseline_encoder
    base_channels: 32
    dropout: 0.1

  decoder:
    name: multiband_decoder
    base_channels: 32
    dropout: 0.0
    sample_rate: 250.0
    low_max_hz: 0.5
    mid_max_hz: 10.0
    high_max_hz: 40.0

  band_loss:
    enabled: true
    total_weight: 0.25
    normalize: true
    scale_floor: 0.05
    weights:
      low: 0.5
      mid: 1.0
      high: 2.0

  cycle_consistency:
    enabled: true
    reverse_encoder:
      name: baseline_encoder
      base_channels: 32
      dropout: 0.0
    reverse_decoder:
      name: baseline_decoder
      base_channels: 32
      dropout: 0.0
    signal_loss: l1
    direct_ecg2ppg_weight: 1.0
    ppg_cycle_weight: 0.5
    reverse_pretrain_epochs: 10
    freeze_reverse: true
    pretrain_ecg_weight: 1.0

  diffusion: null

  loss:
    weights:
      mse: 0.0
      l1: 1.0
      qrs_weighted: 0.10
      qrs_amplitude: 0.20
      derivative: 0.05
      freq: 0.05
      dtw: 0.0
      perceptual: 0.0
    qrs:
      qrs_width_ms: 80.0
      baseline_ms: 400.0
      peak_window_ms: 80.0
      peak_threshold: 0.45
      lead_index: 1
      scale_floor: 0.05

  adversarial:
    enabled: false
  irm:
    enabled: false

training:
  epochs: 20
  lr: 0.0001
  weight_decay: 0.00001
  min_lr: 0.000001
  max_grad_norm: 1.0
  diff_weight: 0.0
  flow_weight: 0.0
  vae_kl_weight: 0.0
  selection_metric: ecg_total
  save_every: 5

seed: 42
device: auto
