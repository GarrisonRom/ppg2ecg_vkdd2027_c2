name: ppg2ecg
# 本地环境: 基于 cuda126_env (D:\Anaconda\envs\cuda126_env)
# GPU: NVIDIA GeForce RTX 4060 Ti (16GB)
# CUDA: 12.6 | PyTorch: 2.6.0+cu126 | Python: 3.10.18
#
# 使用方式:
#   方式1 (推荐): 直接使用已有的 cuda126_env 环境
#     conda activate cuda126_env
#     set PYTHONPATH=<项目根目录>
#
#   方式2: 创建新的 ppg2ecg 环境
#     conda env create -f configs/environment.yml
#     conda activate ppg2ecg

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.0.0
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - numpy>=1.24.0,<2.0
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - jupyter
  - jupyterlab
  - tqdm
  - scikit-learn
  - pillow
  - pip
  - pip:
    # 医学信号处理
    - wfdb>=4.1.0
    - vitaldb>=1.4.0
    - mne>=1.5.0
    - heartpy>=1.2.7
    - neurokit2>=0.2.5
    # 深度学习框架
    - diffusers>=0.21.0
    - transformers>=4.30.0
    - accelerate>=0.20.0
    - torchmetrics>=1.0.0
    - pytorch-lightning>=2.0.0
    # 配置管理
    - hydra-core>=1.3.0
    - omegaconf>=2.3.0
    # 实验追踪
    - wandb>=0.15.0
    - tensorboard>=2.13.0
    # 数据处理
    - h5py>=3.8.0
    - tables>=3.8.0
    - pyarrow>=12.0.0
    - openpyxl>=3.1.0
    # 工具
    - requests>=2.31.0
    - gdown>=4.7.0
    - opencv-python>=4.8.0
    - soundfile>=0.12.0
    - librosa>=0.10.0
    - pyyaml>=6.0
