# v0.3 SensSmartTech: QRS-aware time-domain reconstruction with the v0.2
# VAE + conditional Flow + GRL + subject-wise V-REx architecture.
# Activity labels remain metadata-only and are not model inputs.

experiment:
  name: senssmarttech_v03_qrs_vae_flow_adv_irm_20ep_seed42

data:
  dataset: senssmarttech
  root: data/processed/SensSmartTech/subjectwise_per-lead
  ppg_channel: null
  batch_size: 16
  num_workers: 4

model:
  latent_dim: 128

  encoder:
    name: vae_encoder
    content_dim: 64
    style_dim: 64
    base_channels: 32
    dropout: 0.1

  decoder:
    name: flow_generator
    base_channels: 24
    num_flow_layers: 4
    flow_hidden_channels: 32
    dropout: 0.0

  diffusion: null

  adversarial:
    enabled: true
    hidden_dim: 128
    dropout: 0.1
    loss_weight: 0.1
    grl_max_lambda: 0.3
    grl_warmup_epochs: 3

  irm:
    enabled: true
    mode: vrex
    environment: subject
    loss_weight: 0.01
    min_env_samples: 2

  loss:
    # The QRS term is normalized over its target-derived region, so it can
    # be compared directly with global L1. Frequency remains auxiliary.
    weights:
      mse: 0.0
      l1: 1.0
      qrs_weighted: 1.0
      derivative: 0.2
      freq: 0.1
      dtw: 0.0
      perceptual: 0.0
    qrs:
      qrs_width_ms: 120.0
      baseline_ms: 400.0
      peak_window_ms: 80.0
      peak_threshold: 0.45
      lead_index: 1

training:
  epochs: 20
  lr: 0.0001
  weight_decay: 0.00001
  min_lr: 0.000001
  max_grad_norm: 1.0
  diff_weight: 0.0
  flow_weight: 0.05
  vae_kl_weight: 0.001
  save_every: 5

seed: 42
device: auto
