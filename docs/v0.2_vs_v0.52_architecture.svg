<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">v0.2 and v0.52 architecture comparison</title>
  <desc id="desc">Side by side comparison of the VAE conditional flow architecture in v0.2 and the multi-band frozen reverse-cycle architecture in v0.52.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475467"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#c94b4b"/>
    </marker>
    <style>
      .page { fill:#f7f8fa; }
      .panel { fill:#ffffff; stroke:#d0d5dd; stroke-width:2; }
      .title { font:700 28px Arial, sans-serif; fill:#101828; }
      .panelTitle { font:700 24px Arial, sans-serif; fill:#101828; }
      .subtitle { font:400 15px Arial, sans-serif; fill:#475467; }
      .label { font:600 16px Arial, sans-serif; fill:#101828; }
      .small { font:400 14px Arial, sans-serif; fill:#344054; }
      .tiny { font:400 12px Arial, sans-serif; fill:#475467; }
      .input { fill:#e8f3ff; stroke:#2b6cb0; }
      .encoder { fill:#e6fffa; stroke:#168a76; }
      .latent { fill:#fff5e6; stroke:#c77700; }
      .decoder { fill:#f0eafe; stroke:#7357b8; }
      .fixed { fill:#f2f4f7; stroke:#667085; }
      .aux { fill:#fff0f0; stroke:#c94b4b; }
      .loss { fill:#fff8db; stroke:#b08900; }
      .output { fill:#eaf7e8; stroke:#3c8d40; }
      .box { stroke-width:2; rx:10; ry:10; }
      .arrow { stroke:#475467; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
      .arrowAux { stroke:#c94b4b; stroke-width:2.2; fill:none; marker-end:url(#arrowRed); }
      .dashed { stroke-dasharray:8 6; }
      .divider { stroke:#d0d5dd; stroke-width:1.5; stroke-dasharray:4 6; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1800" height="1240"/>
  <text class="title" x="900" y="38" text-anchor="middle">PPG2ECG architecture comparison: v0.2 vs v0.52</text>
  <text class="subtitle" x="900" y="62" text-anchor="middle">Both use 4-channel PPG and 4-lead ECG at 250 Hz, 2000 samples; the learning assumptions are different.</text>

  <!-- v0.2 panel -->
  <rect class="panel" x="35" y="82" width="840" height="1120" rx="16"/>
  <text class="panelTitle" x="65" y="124">v0.2 | VAE + Conditional Flow</text>
  <text class="subtitle" x="65" y="148">Learn a content/style posterior, model residual likelihood, and remove subject information from content.</text>

  <rect class="box input" x="62" y="190" width="130" height="62"/>
  <text class="label" x="127" y="216" text-anchor="middle">PPG</text>
  <text class="small" x="127" y="238" text-anchor="middle">[B, 4, 2000]</text>

  <rect class="box encoder" x="225" y="165" width="235" height="112"/>
  <text class="label" x="342" y="190" text-anchor="middle">VAEPPGEncoder</text>
  <text class="small" x="342" y="213" text-anchor="middle">Res blocks, stride 2</text>
  <text class="small" x="342" y="235" text-anchor="middle">4-&gt;32-&gt;64-&gt;128-&gt;128</text>
  <text class="small" x="342" y="257" text-anchor="middle">T: 2000-&gt;1000-&gt;500-&gt;250-&gt;125</text>

  <rect class="box latent" x="505" y="190" width="150" height="62"/>
  <text class="label" x="580" y="216" text-anchor="middle">z = [zc | zs]</text>
  <text class="small" x="580" y="238" text-anchor="middle">128 x 125</text>

  <rect class="box decoder" x="694" y="150" width="148" height="92"/>
  <text class="label" x="768" y="176" text-anchor="middle">Context CNN</text>
  <text class="small" x="768" y="198" text-anchor="middle">base=24</text>
  <text class="small" x="768" y="220" text-anchor="middle">no encoder skips</text>

  <rect class="box decoder" x="694" y="295" width="148" height="92"/>
  <text class="label" x="768" y="321" text-anchor="middle">Affine Flow x4</text>
  <text class="small" x="768" y="343" text-anchor="middle">condition = context</text>
  <text class="small" x="768" y="365" text-anchor="middle">alternating masks</text>

  <rect class="box output" x="694" y="435" width="148" height="62"/>
  <text class="label" x="768" y="461" text-anchor="middle">ECG</text>
  <text class="small" x="768" y="483" text-anchor="middle">[B, 4, 2000]</text>

  <path class="arrow" d="M192 221 L225 221"/>
  <path class="arrow" d="M460 221 L505 221"/>
  <path class="arrow" d="M655 221 L694 196"/>
  <path class="arrow" d="M768 242 L768 295"/>
  <path class="arrow" d="M768 387 L768 435"/>

  <rect class="box latent" x="330" y="330" width="180" height="62"/>
  <text class="label" x="420" y="356" text-anchor="middle">z_content</text>
  <text class="small" x="420" y="378" text-anchor="middle">64 x 125, pooled -> [B,64]</text>
  <rect class="box latent" x="530" y="330" width="180" height="62"/>
  <text class="label" x="620" y="356" text-anchor="middle">z_style</text>
  <text class="small" x="620" y="378" text-anchor="middle">64 x 125</text>
  <path class="arrow" d="M580 252 L420 330"/>
  <path class="arrow" d="M580 252 L620 330"/>

  <rect class="box aux" x="80" y="445" width="170" height="76"/>
  <text class="label" x="165" y="472" text-anchor="middle">GRL</text>
  <text class="small" x="165" y="495" text-anchor="middle">lambda 0.1 -> 0.3</text>
  <rect class="box aux" x="290" y="430" width="230" height="106"/>
  <text class="label" x="405" y="456" text-anchor="middle">SubjectDiscriminator</text>
  <text class="small" x="405" y="480" text-anchor="middle">Linear 64->128 + LN/GELU</text>
  <text class="small" x="405" y="502" text-anchor="middle">Dropout -> Linear 128->22</text>
  <text class="tiny" x="405" y="522" text-anchor="middle">content only; 22 train subjects</text>
  <path class="arrowAux" d="M330 361 L250 470"/>
  <path class="arrowAux" d="M250 483 L290 483"/>

  <rect class="box loss" x="78" y="590" width="430" height="150"/>
  <text class="label" x="293" y="617" text-anchor="middle">Training objective</text>
  <text class="small" x="293" y="643" text-anchor="middle">MSE + 0.05 FlowNLL + 0.001(KLcontent + KLstyle)</text>
  <text class="small" x="293" y="667" text-anchor="middle">+ 0.1 SubjectCE + 0.01 V-REx</text>
  <text class="tiny" x="293" y="698" text-anchor="middle">V-REx = variance of per-subject sample risk</text>
  <text class="tiny" x="293" y="718" text-anchor="middle">risk = reconstruction MSE + weighted Flow NLL</text>
  <path class="arrowAux" d="M405 536 L405 590"/>
  <path class="arrow" d="M768 497 C690 560 585 620 508 650"/>

  <rect class="box loss" x="540" y="590" width="302" height="150"/>
  <text class="label" x="691" y="617" text-anchor="middle">Inference behavior</text>
  <text class="small" x="691" y="645" text-anchor="middle">eval mode uses posterior means</text>
  <text class="small" x="691" y="670" text-anchor="middle">Flow forward uses zero noise</text>
  <text class="small" x="691" y="695" text-anchor="middle">deterministic ECG metrics</text>
  <text class="tiny" x="691" y="719" text-anchor="middle">sample() remains available for stochastic output</text>

  <line class="divider" x1="65" y1="800" x2="845" y2="800"/>
  <text class="label" x="65" y="838">What is distinctive</text>
  <text class="small" x="80" y="872">• stochastic latent posterior: zc and zs are sampled during training</text>
  <text class="small" x="80" y="899">• conditional likelihood head: context ECG + 4 affine coupling layers</text>
  <text class="small" x="80" y="926">• invariance pressure: subject classifier sees zc only through GRL</text>
  <text class="small" x="80" y="953">• no frequency-specific decoder branches and no reverse ECG->PPG path</text>

  <rect class="box latent" x="65" y="1000" width="360" height="105"/>
  <text class="label" x="245" y="1028" text-anchor="middle">Parameter count</text>
  <text class="small" x="245" y="1053" text-anchor="middle">encoder 0.504M + flow generator 0.618M</text>
  <text class="small" x="245" y="1076" text-anchor="middle">subject head 0.011M</text>
  <text class="small" x="245" y="1098" text-anchor="middle">training total approx. 1.134M</text>

  <rect class="box output" x="460" y="1000" width="380" height="105"/>
  <text class="label" x="650" y="1028" text-anchor="middle">Test snapshot</text>
  <text class="small" x="650" y="1053" text-anchor="middle">RMSE 0.8428 | PCC 0.3486 | HR err 10.38 bpm</text>
  <text class="small" x="650" y="1076" text-anchor="middle">R-peak F1 0.9215 | QRS width err 15.53 ms</text>
  <text class="tiny" x="650" y="1098" text-anchor="middle">stronger global shape and peak F1; weaker HR/QRS-width than v0.52</text>

  <!-- v0.52 panel -->
  <rect class="panel" x="925" y="82" width="840" height="1120" rx="16"/>
  <text class="panelTitle" x="955" y="124">v0.52 | Multi-band + Frozen Reverse Cycle</text>
  <text class="subtitle" x="955" y="148">Keep a deterministic skip-connected path and make baseline, morphology, and QRS detail explicit.</text>

  <rect class="box input" x="950" y="190" width="130" height="62"/>
  <text class="label" x="1015" y="216" text-anchor="middle">PPG</text>
  <text class="small" x="1015" y="238" text-anchor="middle">[B, 4, 2000]</text>

  <rect class="box encoder" x="1110" y="165" width="220" height="112"/>
  <text class="label" x="1220" y="190" text-anchor="middle">BaselinePPGEncoder</text>
  <text class="small" x="1220" y="213" text-anchor="middle">4 residual downsampling blocks</text>
  <text class="small" x="1220" y="235" text-anchor="middle">4->32->64->128->128</text>
  <text class="small" x="1220" y="257" text-anchor="middle">latent [B,128,125] + 3 skips</text>

  <rect class="box decoder" x="1370" y="165" width="200" height="112"/>
  <text class="label" x="1470" y="190" text-anchor="middle">Shared decoder</text>
  <text class="small" x="1470" y="213" text-anchor="middle">base=32, x4 upsample</text>
  <text class="small" x="1470" y="235" text-anchor="middle">skip concat at 250/500/1000</text>
  <text class="small" x="1470" y="257" text-anchor="middle">feature [B,16,2000]</text>
  <path class="arrow" d="M1080 221 L1110 221"/>
  <path class="arrow" d="M1330 221 L1370 221"/>
  <path class="arrow" d="M1295 272 C1330 315 1370 305 1405 277"/>
  <text class="tiny" x="1330" y="310" text-anchor="middle">skip0/1/2</text>

  <rect class="box fixed" x="970" y="365" width="190" height="80"/>
  <text class="label" x="1065" y="391" text-anchor="middle">Low head</text>
  <text class="small" x="1065" y="414" text-anchor="middle">16-&gt;16-&gt;4; mask &lt;=0.5 Hz</text>
  <text class="tiny" x="1065" y="434" text-anchor="middle">baseline drift</text>
  <rect class="box fixed" x="1190" y="365" width="190" height="80"/>
  <text class="label" x="1285" y="391" text-anchor="middle">Mid head</text>
  <text class="small" x="1285" y="414" text-anchor="middle">16->16->4; 0.5-10 Hz</text>
  <text class="tiny" x="1285" y="434" text-anchor="middle">P/T morphology + rhythm</text>
  <rect class="box fixed" x="1410" y="365" width="190" height="80"/>
  <text class="label" x="1505" y="391" text-anchor="middle">High head</text>
  <text class="small" x="1505" y="414" text-anchor="middle">16->16->4; 10-40 Hz</text>
  <text class="tiny" x="1505" y="434" text-anchor="middle">QRS detail</text>
  <path class="arrow" d="M1440 277 C1350 320 1135 320 1065 365"/>
  <path class="arrow" d="M1470 277 L1285 365"/>
  <path class="arrow" d="M1500 277 C1530 320 1510 340 1505 365"/>

  <rect class="box decoder" x="1190" y="495" width="230" height="70"/>
  <text class="label" x="1305" y="522" text-anchor="middle">fixed FFT projection + fusion</text>
  <text class="small" x="1305" y="545" text-anchor="middle">3 x [B,4,2000] -> 1x1 conv -> [B,4,2000]</text>
  <path class="arrow" d="M1065 445 L1240 495"/>
  <path class="arrow" d="M1285 445 L1305 495"/>
  <path class="arrow" d="M1505 445 L1370 495"/>

  <rect class="box output" x="1230" y="600" width="150" height="62"/>
  <text class="label" x="1305" y="626" text-anchor="middle">ECG_hat</text>
  <text class="small" x="1305" y="648" text-anchor="middle">[B, 4, 2000]</text>
  <path class="arrow" d="M1305 565 L1305 600"/>

  <rect class="box input" x="950" y="700" width="130" height="62"/>
  <text class="label" x="1015" y="726" text-anchor="middle">ECG target</text>
  <text class="small" x="1015" y="748" text-anchor="middle">[B, 4, 2000]</text>
  <rect class="box aux" x="1110" y="675" width="190" height="112"/>
  <text class="label" x="1205" y="701" text-anchor="middle">Reverse encoder</text>
  <text class="small" x="1205" y="724" text-anchor="middle">same baseline encoder</text>
  <text class="small" x="1205" y="746" text-anchor="middle">ECG -> [B,128,125]</text>
  <text class="tiny" x="1205" y="768" text-anchor="middle">input channels forced to 4</text>
  <rect class="box aux" x="1340" y="675" width="190" height="112"/>
  <text class="label" x="1435" y="701" text-anchor="middle">Reverse decoder</text>
  <text class="small" x="1435" y="724" text-anchor="middle">baseline decoder</text>
  <text class="small" x="1435" y="746" text-anchor="middle">latent -> PPG [B,4,2000]</text>
  <text class="tiny" x="1435" y="768" text-anchor="middle">frozen after epoch 10</text>
  <rect class="box output" x="1570" y="680" width="150" height="62"/>
  <text class="label" x="1645" y="706" text-anchor="middle">PPG_direct</text>
  <text class="small" x="1645" y="728" text-anchor="middle">L1 to PPG</text>
  <path class="arrow" d="M1080 731 L1110 731"/>
  <path class="arrow" d="M1300 731 L1340 731"/>
  <path class="arrow" d="M1530 731 L1570 711"/>

  <rect class="box aux" x="1110" y="835" width="190" height="92"/>
  <text class="label" x="1205" y="861" text-anchor="middle">Generated ECG path</text>
  <text class="small" x="1205" y="884" text-anchor="middle">ECG_hat -> frozen reverse</text>
  <text class="small" x="1205" y="906" text-anchor="middle">-> PPG_cycle</text>
  <rect class="box loss" x="1340" y="835" width="380" height="92"/>
  <text class="label" x="1530" y="861" text-anchor="middle">cycle terms</text>
  <text class="small" x="1530" y="884" text-anchor="middle">1.0 L1(PPG_direct, PPG) + 0.5 L1(PPG_cycle, PPG)</text>
  <text class="tiny" x="1530" y="908" text-anchor="middle">after freezing, only PPG_cycle sends gradient to the main path</text>
  <path class="arrowAux dashed" d="M1305 662 C1230 710 1180 770 1205 835"/>
  <path class="arrowAux" d="M1300 881 L1340 881"/>
  <path class="arrowAux" d="M1645 742 C1660 790 1590 815 1530 835"/>

  <rect class="box loss" x="950" y="980" width="770" height="125"/>
  <text class="label" x="1335" y="1007" text-anchor="middle">Training objective and schedule</text>
  <text class="small" x="1335" y="1032" text-anchor="middle">Stage 1, epochs 1-10: L_signal + L_band + 1.0 reverse direct L1</text>
  <text class="small" x="1335" y="1055" text-anchor="middle">Stage 2, epochs 11-20: L_signal + L_band + 1.0 direct L1 + 0.5 cycle L1; reverse frozen</text>
  <text class="tiny" x="1335" y="1080" text-anchor="middle">L_signal = L1 + 0.05 derivative + 0.05 multi-scale STFT; L_band = 0.25(0.5 low + 1 mid + 2 high)</text>
  <text class="tiny" x="1335" y="1098" text-anchor="middle">FFT bands are fixed; frequencies above 40 Hz are excluded from the explicit branches.</text>

  <line class="divider" x1="955" y1="1140" x2="1745" y2="1140"/>
  <text class="small" x="955" y="1168">Main path params: approx. 1.411M</text>
  <text class="small" x="1320" y="1168">Main + reverse training graph: approx. 2.816M</text>
  <text class="tiny" x="955" y="1189">Deployable inference is PPG -> ECG_hat; reverse branch is training-only.</text>

  <text class="tiny" x="900" y="1225" text-anchor="middle">Source: src/models/{baseline.py, vae_flow.py, band_decoder.py} and src/training/trainer.py</text>
</svg>
